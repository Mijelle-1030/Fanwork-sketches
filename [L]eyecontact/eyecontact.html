<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eye Contact — mijelle</title>

  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1.4.0/dist/ml5.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: "Courier New", Courier, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background: #1a1a1a;
      color: #eeeaff;
    }

    .page {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
      color: #a99cf8;
      font-size: 12px;
      letter-spacing: 0.16em;
    }

    #stage {
      overflow: hidden;
      background: #1a1a1a;
    }

    #stage canvas {
      display: block;
      width: 100% !important;
      height: auto !important;
    }

    .controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 16px 0;
      background: transparent;
    }

    button,
    select {
      min-height: 42px;
      border: 1px solid #806ff6;
      border-radius: 0;
      background: #211936;
      color: #eeeaff;
      font: 13px "Courier New", Courier, monospace;
    }

    button {
      padding: 0 18px;
      cursor: pointer;
    }

    button.is-on {
      background: #806ff6;
      color: #090711;
      font-weight: bold;
    }

    button:disabled,
    select:disabled {
      cursor: wait;
      opacity: 0.5;
    }

    button:hover:not(:disabled),
    select:hover:not(:disabled) {
      border-color: #c2b9ff;
    }

    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #c2b9ff;
      outline-offset: 3px;
    }

    label {
      color: #a99cf8;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    select {
      max-width: min(100%, 310px);
      padding: 0 12px;
      cursor: pointer;
    }

    #status {
      margin-left: auto;
      color: #a99cf8;
      font-size: 12px;
      line-height: 1.5;
    }

    .note {
      margin: 14px 0 0;
      color: #827895;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 650px) {
      header {
        font-size: 10px;
      }

      .controls {
        align-items: stretch;
      }

      button,
      select {
        width: 100%;
        max-width: none;
      }

      #status {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <div id="stage"></div>

    <div class="controls">
      <button id="camera-toggle" type="button">TURN CAMERA ON</button>

      <label for="camera-select">CAMERA</label>
      <select id="camera-select" disabled>
        <option value="">DEFAULT CAMERA</option>
      </select>

      <span id="status" role="status" aria-live="polite">CAMERA OFF</span>
    </div>

  </div>

  <script src="sketch.js"></script>
</body>
</html>
